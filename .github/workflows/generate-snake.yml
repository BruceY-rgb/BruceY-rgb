name: Generate Snake Animation

on:
  schedule:
    # 每周一 UTC 00:00 (北京时间 08:00) 生成
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
      paths:
        - 'contributions/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation
        uses: Platane/svg/output/github-contribution-grid-snake.svg@main
        with:
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: generate snake animation"
          git push
